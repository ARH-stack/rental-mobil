<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoRent Pro — Sistem Manajemen Rental Mobil</title>
  <meta name="theme-color" content="#0C0D12">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2314161F'/%3E%3Cpath d='M20 65 L30 35 L70 35 L80 65 Z' fill='%23E5B842'/%3E%3Ccircle cx='35' cy='68' r='10' fill='%23F7D87E'/%3E%3Ccircle cx='65' cy='68' r='10' fill='%23F7D87E'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       TOKEN WARNA & GAYA: LUXURY DARK OBSIDIAN & GOLD ACCENTS (NO EMOJI)
       ========================================================================== */
    :root {
      color-scheme: dark;
      --bg: #0C0D12;
      --bg-surface: #14161F;
      --bg-card: #181B26;
      --bg-card-hover: #222636;
      --bg-inset: #090A0E;
      
      --ink: #F9FAFB;
      --mute: #9CA3AF;
      --dim: #6B7280;
      
      /* Palet Emas */
      --gold: #E5B842;
      --gold-light: #F7D87E;
      --gold-dark: #B88E28;
      --gold-glow: rgba(229, 184, 66, 0.28);
      --gold-soft: rgba(229, 184, 66, 0.12);
      --gold-grad: linear-gradient(135deg, #FCE59F 0%, #E5B842 50%, #B88E28 100%);
      --gold-border: rgba(229, 184, 66, 0.24);
      --gold-border-focus: rgba(229, 184, 66, 0.6);

      /* Status Operasional */
      --ok: #10B981;
      --ok-soft: rgba(16, 185, 129, 0.14);
      --warn: #F59E0B;
      --warn-soft: rgba(245, 158, 11, 0.14);
      --bad: #EF4444;
      --bad-soft: rgba(239, 68, 68, 0.14);
      --info: #3B82F6;
      --info-soft: rgba(59, 130, 246, 0.14);

      /* Efek Bayangan & Bevel Gelap */
      --raise: 0 10px 28px rgba(0, 0, 0, 0.65), 0 0 0 1px var(--gold-border);
      --raise-s: 0 4px 14px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(229, 184, 66, 0.16);
      --raise-glow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 18px var(--gold-glow), 0 0 0 1px var(--gold-border);
      --inset: inset 2px 2px 6px rgba(0, 0, 0, 0.8), inset -1px -1px 3px rgba(229, 184, 66, 0.05);

      --f-head: 'Cinzel', serif;
      --f-body: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 500 15px/1.6 var(--f-body);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, h4 {
      margin: 0;
      line-height: 1.25;
      color: var(--ink);
    }
    h1, h2 { font-family: var(--f-head); letter-spacing: 0.02em; }
    h1 { font-size: clamp(1.8rem, 4.5vw, 2.7rem); font-weight: 700; }
    h2 { font-size: clamp(1.3rem, 3vw, 1.7rem); font-weight: 700; }
    h3 { font-size: 1.15rem; font-weight: 700; }
    h4 { font-size: 1rem; font-weight: 600; }

    p { margin: 0; }
    a { color: var(--gold-light); text-decoration: none; }
    a:hover { text-decoration: underline; }
    small, .muted { color: var(--mute); font-size: 0.85rem; }
    .gold-text {
      background: var(--gold-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: inline-block;
    }

    /* Utilitas Layout */
    .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; width: 100%; }
    .stack > * + * { margin-top: 18px; }
    .row { display: flex; align-items: center; flex-wrap: wrap; }
    .gap-s { gap: 8px; }
    .gap { gap: 14px; }
    .gap-l { gap: 24px; }
    .between { justify-content: space-between; }
    .center { align-items: center; justify-content: center; }
    .grid { display: grid; gap: 18px; }
    .grid-2 { grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); }
    .grid-3 { grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
    .grid-4 { grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); }
    .hide { display: none !important; }

    /* Komponen Kartu & Permukaan */
    .card {
      background: var(--bg-card);
      border-radius: 18px;
      box-shadow: var(--raise);
      padding: 22px;
      position: relative;
      border: 1px solid var(--gold-border);
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      border-color: rgba(229, 184, 66, 0.4);
    }
    .card.sm { padding: 14px 18px; border-radius: 14px; box-shadow: var(--raise-s); }
    .card-highlight {
      background: linear-gradient(145deg, rgba(229,184,66,0.08) 0%, rgba(20,22,31,0.95) 100%);
      box-shadow: var(--raise-glow);
    }
    .inset {
      background: var(--bg-inset);
      border-radius: 14px;
      box-shadow: var(--inset);
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,0.04);
    }

    /* Tombol Interaktif */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: 1px solid var(--gold-border);
      cursor: pointer;
      text-decoration: none;
      background: var(--bg-surface);
      color: var(--ink);
      font-weight: 700;
      padding: 10px 20px;
      border-radius: 12px;
      min-height: 44px;
      font-size: 0.92rem;
      transition: all 0.15s ease-in-out;
      box-shadow: var(--raise-s);
      user-select: none;
    }
    .btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--gold-light);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: none;
      box-shadow: var(--inset);
    }
    .btn.primary {
      background: var(--gold-grad);
      color: #121008;
      border: 1px solid var(--gold-light);
      box-shadow: 0 4px 18px var(--gold-glow);
    }
    .btn.primary:hover {
      box-shadow: 0 6px 24px rgba(229, 184, 66, 0.45);
      filter: brightness(1.06);
    }
    .btn.primary:active {
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.4);
    }
    .btn.danger {
      background: var(--bad-soft);
      color: var(--bad);
      border-color: rgba(239, 68, 68, 0.4);
    }
    .btn.danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }
    .btn.sm {
      min-height: 36px;
      padding: 6px 14px;
      font-size: 0.84rem;
      border-radius: 10px;
    }
    .btn.block { width: 100%; }
    .btn[disabled] {
      opacity: 0.45;
      pointer-events: none;
    }

    /* SVG Icons Utility */
    .svg-icon {
      width: 18px;
      height: 18px;
      stroke-width: 2;
      stroke: currentColor;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Badge & Tag */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .b-ready { background: var(--ok-soft); color: var(--ok); border: 1px solid rgba(16,185,129,0.3); }
    .b-rented { background: var(--warn-soft); color: var(--warn); border: 1px solid rgba(245,158,11,0.3); }
    .b-service { background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(239,68,68,0.3); }
    .b-gold { background: var(--gold-soft); color: var(--gold-light); border: 1px solid var(--gold-border); }

    /* Input & Form */
    label.f { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 4px; color: var(--ink); }
    label.f > span { display: block; margin-bottom: 6px; }
    .in, select.in, textarea.in {
      width: 100%;
      border: 1px solid rgba(229, 184, 66, 0.2);
      background: var(--bg-inset);
      color: var(--ink);
      border-radius: 12px;
      padding: 10px 14px;
      min-height: 44px;
      font: inherit;
      box-shadow: var(--inset);
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .in:focus, select.in:focus, textarea.in:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-glow);
    }
    textarea.in { min-height: 80px; resize: vertical; }
    .in::placeholder { color: var(--dim); }

    /* Pilihan Radio Kartu (Paket Sewa) */
    .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .opt { position: relative; cursor: pointer; display: block; }
    .opt input { position: absolute; opacity: 0; inset: 0; }
    .opt > span {
      display: block;
      padding: 14px;
      border-radius: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--gold-border);
      box-shadow: var(--raise-s);
      transition: all 0.15s;
    }
    .opt input:checked + span {
      background: rgba(229, 184, 66, 0.12);
      border-color: var(--gold);
      box-shadow: 0 0 14px var(--gold-glow);
    }

    /* Navigasi Header Publik */
    header.pub-header {
      background: rgba(12, 13, 18, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--gold-border);
      position: sticky;
      top: 0;
      z-index: 50;
      padding: 14px 0;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--f-head);
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--ink);
    }
    .brand span.symbol {
      width: 32px;
      height: 32px;
      background: var(--gold-grad);
      color: #0c0d12;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: 0 2px 10px var(--gold-glow);
    }

    /* Layout Admin dengan Sidebar */
    .admin-layout {
      display: flex;
      min-height: 100vh;
      background: var(--bg);
    }
    .admin-sidebar {
      width: 250px;
      background: var(--bg-surface);
      border-right: 1px solid var(--gold-border);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }
    .admin-nav {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 16px;
      border-radius: 12px;
      color: var(--mute);
      font-weight: 600;
      transition: all 0.15s;
    }
    .nav-link:hover {
      background: rgba(229, 184, 66, 0.08);
      color: var(--gold-light);
      text-decoration: none;
    }
    .nav-link.active {
      background: var(--gold-grad);
      color: #0f1015;
      font-weight: 700;
      box-shadow: 0 4px 14px var(--gold-glow);
    }
    .admin-main {
      flex: 1;
      padding: 28px 32px;
      overflow-y: auto;
      max-width: 1400px;
    }

    /* Bottom Bar Navigasi Mobile */
    .mobile-bottom-nav {
      display: none;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(18, 20, 28, 0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--gold-border);
      padding: 8px 12px calc(8px + env(safe-area-inset-bottom));
      z-index: 100;
      justify-content: space-around;
    }
    .mob-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--mute);
      font-size: 0.72rem;
      font-weight: 600;
      text-decoration: none;
    }
    .mob-link.active {
      color: var(--gold);
    }

    /* Modal Dialog */
    .ov {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 200;
    }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--gold);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 24px var(--gold-glow);
      border-radius: 20px;
      max-width: 620px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast-msg {
      background: var(--bg-card);
      color: var(--ink);
      border: 1px solid var(--gold);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.25s ease-out;
    }

    /* Skeleton Loading */
    .sk {
      background: linear-gradient(90deg, #181b26 25%, #232838 50%, #181b26 75%);
      background-size: 200% 100%;
      animation: skel 1.5s infinite;
      border-radius: 8px;
    }
    @keyframes skel { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    /* Kartu Mobil Publik */
    .car-card-img {
      width: 100%;
      height: 190px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #10121a;
    }

    /* Image Upload Box */
    .img-upload-box {
      border: 2px dashed var(--gold-border);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      background: rgba(229, 184, 66, 0.03);
      cursor: pointer;
      transition: all 0.2s;
    }
    .img-upload-box:hover {
      border-color: var(--gold);
      background: rgba(229, 184, 66, 0.07);
    }
    .preview-thumbnail {
      width: 100%;
      max-height: 180px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
      border: 1px solid var(--gold-border);
    }

    /* Cetak Invoice / Nota */
    @media print {
      body * { visibility: hidden; }
      #printable-area, #printable-area * { visibility: visible; }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        background: #fff !important;
        color: #000 !important;
        padding: 24px;
      }
      #printable-area .badge, #printable-area .btn { display: none !important; }
    }

    /* Responsivitas Layar Kecil */
    @media (max-width: 900px) {
      .admin-sidebar { display: none; }
      .admin-main { padding: 20px 16px 100px; }
      .mobile-bottom-nav { display: flex; }
      header.pub-header { padding: 12px 0; }
    }
  </style>
</head>
<body>

  <!-- BANNER ERROR CONFIG JIKA BELUM DIISI -->
  <div id="cfg-warn" class="hide" style="background:#B8324F;color:#fff;padding:12px;text-align:center;font-weight:700;z-index:9999;">
    PEMBERITAHUAN: CONFIG.API_URL belum diisi. Silakan buka file index.html dan masukkan URL deployment Web App Google Apps Script Anda.
  </div>

  <div id="toast"></div>
  <div id="app"></div>

  <script>
    /**
     * =========================================================================
     *  AUTORENT PRO — FRONTEND SINGLE-FILE APPLICATION (NO EMOJI)
     * =========================================================================
     */

    // 1. KONFIGURASI API BACKEND GOOGLE APPS SCRIPT
    // Tempelkan URL Web App hasil deploy Apps Script (berakhiran /exec) di sini:
    const CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbwIXqEms6obzrbqldHhtkz_CDZTLYXIOpw2jIRVDBRY5iQ5KlVp1S7HniQRIDWtR5xUIQ/exec'
    };

    // State Aplikasi
    const S = {
      token: (function() {
        try { return localStorage.getItem('autorent_token') || ''; } catch(e) { return ''; }
      })(),
      publicInfo: null,
      adminData: null,
      cacheCars: [],
      cacheRentals: []
    };

    // Helper Utility
    function esc(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/[&<>"']/g, function(m) {
        return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m];
      });
    }

    function rp(n) {
      return 'Rp ' + Number(n || 0).toLocaleString('id-ID');
    }

    function fmtDate(s) {
      if (!s) return '-';
      return String(s).slice(0, 10);
    }

    function setToken(t) {
      S.token = t;
      try {
        if (t) localStorage.setItem('autorent_token', t);
        else localStorage.removeItem('autorent_token');
      } catch(e) {}
    }

    function toast(msg, isBad) {
      const c = document.getElementById('toast');
      const d = document.createElement('div');
      d.className = 'toast-msg';
      if (isBad) {
        d.style.borderColor = 'var(--bad)';
        d.style.color = '#FFA8B8';
      }
      d.innerHTML = (isBad ? '[PERINGATAN] ' : '[BERHASIL] ') + esc(msg);
      c.appendChild(d);
      setTimeout(() => { d.remove(); }, 3500);
    }

    // Pemanggil API JSON ke Apps Script (Menggunakan text/plain agar bebas preflight CORS)
    async function api(action, data) {
      if (!CONFIG.API_URL || CONFIG.API_URL.includes('PASTE_URL')) {
        document.getElementById('cfg-warn').classList.remove('hide');
        throw new Error('CONFIG.API_URL belum diisi. Ikuti petunjuk pada PANDUAN-INSTALASI.md.');
      }
      try {
        const res = await fetch(CONFIG.API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, token: S.token, data: data || {} })
        });
        const json = await res.json();
        if (!json.ok) {
          if (json.code === 'AUTH') {
            setToken('');
            location.hash = '#/admin';
            toast('Sesi berakhir. Silakan login kembali.', true);
          }
          throw new Error(json.message || 'Gagal memproses data server.');
        }
        return json.data;
      } catch (err) {
        throw err;
      }
    }

    // Helper Kompresi Gambar di Browser sebelum dikirim ke Google Drive
    function compressImageFile(file, maxWidth, quality) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width;
            let h = img.height;
            if (w > maxWidth) {
              h = Math.round((h * maxWidth) / w);
              w = maxWidth;
            }
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL('image/jpeg', quality || 0.8);
            resolve(dataUrl);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    // =========================================================================
    // ROUTER & VIEW RENDERING
    // =========================================================================

    function route() {
      const hash = location.hash || '#/';
      if (hash.startsWith('#/admin')) {
        renderAdminArea(hash);
      } else {
        renderPublicArea(hash);
      }
    }

    window.addEventListener('hashchange', route);
    window.addEventListener('DOMContentLoaded', () => {
      if (!CONFIG.API_URL || CONFIG.API_URL.includes('PASTE_URL')) {
        document.getElementById('cfg-warn').classList.remove('hide');
      }
      route();
    });

    // -------------------------------------------------------------------------
    // AREA PUBLIK (BERANDA, FORM PESAN, LACAK)
    // -------------------------------------------------------------------------

    async function renderPublicArea(hash) {
      const app = document.getElementById('app');
      app.innerHTML = `
        <header class="pub-header">
          <div class="wrap row between">
            <a href="#/" class="brand">
              <span class="symbol">AR</span>
              <div>
                <span class="gold-text">AUTORENT</span> PRO
              </div>
            </a>
            <div class="row gap">
              <a href="#/" class="btn sm">Katalog Armada</a>
              <a href="#/lacak" class="btn sm">Lacak Sewa</a>
              <a href="#/admin" class="btn sm primary">Login Pengelola</a>
            </div>
          </div>
        </header>

        <main id="pub-view" style="flex:1; padding-bottom:50px;">
          <div class="wrap stack" style="margin-top:24px;">
            <div class="sk" style="height:320px;"></div>
          </div>
        </main>

        <footer style="background:#090A0E; border-top:1px solid var(--gold-border); padding:24px 0; text-align:center;">
          <div class="wrap">
            <p class="muted">2026 AutoRent Pro — Solusi Manajemen Rental Mobil Profesional</p>
          </div>
        </footer>
      `;

      try {
        if (!S.publicInfo) {
          S.publicInfo = await api('publicInfo');
        }
        const v = document.getElementById('pub-view');

        if (hash === '#/lacak') {
          v.innerHTML = viewPublicTrack();
        } else if (hash.startsWith('#/pesan')) {
          const params = new URLSearchParams(hash.split('?')[1] || '');
          const preCarId = params.get('car') || '';
          v.innerHTML = viewPublicBooking(preCarId);
        } else {
          v.innerHTML = viewPublicHome();
        }
      } catch (err) {
        document.getElementById('pub-view').innerHTML = `
          <div class="wrap" style="padding:40px 0;">
            <div class="card" style="text-align:center;">

    function buildRentalTableHtml(list) {
      if (!list.length) return '<p class="muted" style="padding:24px; text-align:center;">Tidak ada transaksi sewa ditemukan.</p>';

      return `
        <table style="width:100%; border-collapse:collapse; font-size:0.88rem;">
          <thead>
            <tr style="border-bottom:1px solid var(--gold-border); text-align:left; color:var(--gold);">
              <th style="padding:10px 8px;">No. Sewa</th>
              <th style="padding:10px 8px;">Tgl Sewa</th>
              <th style="padding:10px 8px;">Penyewa & Kontak</th>
              <th style="padding:10px 8px;">Mobil & Paket</th>
              <th style="padding:10px 8px;">Periode Sewa</th>
              <th style="padding:10px 8px;">Total & Sisa</th>
              <th style="padding:10px 8px;">Status</th>
              <th style="padding:10px 8px; text-align:right;">Aksi Cepat</th>
            </tr>
          </thead>
          <tbody>
            ${list.map(r => `
              <tr style="border-bottom:1px solid rgba(255,255,255,0.05);">
                <td style="padding:10px 8px; font-weight:700;">${esc(r.NoSewa)}</td>
                <td style="padding:10px 8px;" class="muted">${fmtDate(r.Tanggal)}</td>
                <td style="padding:10px 8px;">
                  <strong>${esc(r.CustomerNama)}</strong>
                  <div class="muted" style="font-size:0.8rem;">WA: ${esc(r.CustomerWA)}</div>
                </td>
                <td style="padding:10px 8px;">
                  <div>${esc(r.MobilSnapshot)}</div>
                  <span class="badge b-gold" style="font-size:0.7rem;">${esc(r.Paket)}</span>
                </td>
                <td style="padding:10px 8px; font-size:0.82rem;">
                  <div>${esc(r.TglMulai)} s/d ${esc(r.TglSelesai)}</div>
                  <small class="muted">(${r.DurasiHari} Hari)</small>
                </td>
                <td style="padding:10px 8px;">
                  <div><strong>${rp(r.Total)}</strong></div>
                  <small style="color:${r.Sisa > 0 ? 'var(--bad)' : 'var(--ok)'};">Sisa: ${rp(r.Sisa)}</small>
                </td>
                <td style="padding:10px 8px;">
                  <span class="badge ${r.StatusSewa === 'Aktif' ? 'b-ready' : r.StatusSewa === 'Booking' ? 'b-rented' : 'b-gold'}">${esc(r.StatusSewa)}</span>
                  <div style="margin-top:2px;">
                    <span class="badge ${r.StatusBayar === 'Lunas' ? 'b-ready' : 'b-rented'}" style="font-size:0.7rem;">${esc(r.StatusBayar)}</span>
                  </div>
                </td>
                <td style="padding:10px 8px; text-align:right;">
                  <div class="row gap-s" style="justify-content:flex-end;">
                    <button data-act="viewRentalDetail" data-id="${esc(r.NoSewa)}" class="btn sm">Detail</button>
                    ${r.StatusSewa === 'Aktif' ? `
                      <button data-act="openReturnModal" data-id="${esc(r.NoSewa)}" class="btn sm primary">Proses Return</button>
                    ` : ''}
                    ${r.StatusSewa === 'Booking' ? `
                      <button data-act="activateRental" data-id="${esc(r.NoSewa)}" class="btn sm primary">Serah Terima</button>
                    ` : ''}
                  </div>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function applyRentalFilter() {
      const q = (document.getElementById('filter-rental-search').value || '').toLowerCase();
      const status = document.getElementById('filter-rental-status').value;

      let list = S.cacheRentals || [];
      if (status !== 'Semua') {
        list = list.filter(r => r.StatusSewa === status);
      }
      if (q) {
        list = list.filter(r =>
          String(r.NoSewa || '').toLowerCase().includes(q) ||
          String(r.CustomerNama || '').toLowerCase().includes(q) ||
          String(r.PlatNomor || '').toLowerCase().includes(q) ||
          String(r.CustomerWA || '').toLowerCase().includes(q)
        );
      }
      document.getElementById('rental-list-table').innerHTML = buildRentalTableHtml(list);
    }

    async function handleCarFileSelect(input) {
      if (!input.files || !input.files[0]) return;
      const file = input.files[0];
      try {
        const previewImg = document.getElementById('car-preview-img');
        previewImg.src = URL.createObjectURL(file);
        previewImg.classList.remove('hide');

        // Kompresi di browser (max lebar 1000px, kualitas 80%) agar upload sekejap
        const base64 = await compressImageFile(file, 1000, 0.8);
        document.getElementById('car-image-base64').value = base64;
        toast('Foto dipilih dan siap diunggah saat Anda menekan tombol Simpan.');
      } catch (err) {
        toast('Gagal memproses gambar: ' + err.message, true);
      }
    }

        const res = await api('login', val);
        setToken(res.token);
        toast('Login berhasil. Selamat datang di AutoRent Pro.');
        location.hash = '#/admin/dashboard';
      },
      publicBooking: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        const res = await api('createPublicBooking', val);
        toast('Booking berhasil diajukan.');
        const waMsg = `Halo Admin AutoRent, saya ingin konfirmasi booking mobil ${res.mobil} (${res.platNomor}) dengan No. Sewa: ${res.noSewa}. Total estimasi: ${rp(res.total)}.`;
        const waUrl = `https://wa.me/${esc(S.publicInfo.settings.wa)}?text=${encodeURIComponent(waMsg)}`;

        document.getElementById('pub-view').innerHTML = `
          <div class="wrap" style="max-width:650px; margin-top:30px;">
            <div class="card card-highlight stack" style="text-align:center; padding:36px;">
              <h2>Permohonan Booking Berhasil Terkirim</h2>
              <p class="muted">Terima kasih atas pemesanan Anda, <strong>${esc(res.customerNama)}</strong>. Permohonan sewa mobil telah tercatat di sistem kami.</p>
              
              <div class="inset stack" style="margin:20px 0; padding:18px;">
                <span class="muted">Nomor Transaksi Sewa:</span>
                <h2 class="gold-text" style="font-size:1.8rem;">${esc(res.noSewa)}</h2>
                <small class="muted">Simpan No. Sewa ini untuk memeriksa status persetujuan.</small>
              </div>

              <div class="stack" style="gap:10px;">
                <a href="${waUrl}" target="_blank" class="btn primary block" style="min-height:50px;">
                  Konfirmasi Otomatis ke WhatsApp Admin
                </a>
                <a href="#/lacak" class="btn block">Lacak Status Booking</a>
                <a href="#/" class="btn sm">Kembali ke Beranda</a>
              </div>
            </div>
          </div>
        `;
      },
      trackBooking: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        const res = await api('trackBooking', val);
        document.getElementById('track-result').innerHTML = `
          <div class="inset stack" style="margin-top:14px;">
            <div class="row between">
              <span class="badge b-gold">${esc(res.NoSewa)}</span>
              <span class="badge ${res.StatusSewa === 'Aktif' ? 'b-ready' : res.StatusSewa === 'Booking' ? 'b-rented' : 'b-gold'}">${esc(res.StatusSewa)}</span>
            </div>
            <h3 style="margin-top:4px;">${esc(res.Mobil)}</h3>
            <div class="muted" style="font-size:0.86rem;">Penyewa: <strong>${esc(res.CustomerNama)}</strong> | Paket: ${esc(res.Paket)}</div>
            <div class="muted" style="font-size:0.86rem;">Periode: ${esc(res.TglMulai)} s/d ${esc(res.TglSelesai)}</div>
            
            <div class="card sm row between" style="margin-top:8px;">
              <div>
                <span class="muted">Total Biaya:</span>
                <div><strong>${rp(res.Total)}</strong></div>
              </div>
              <div style="text-align:right;">
                <span class="badge ${res.StatusBayar === 'Lunas' ? 'b-ready' : 'b-rented'}">${esc(res.StatusBayar)}</span>
                <div style="font-size:0.82rem; margin-top:2px; color:${res.Sisa > 0 ? 'var(--bad)' : 'var(--ok)'};">Sisa: ${rp(res.Sisa)}</div>
              </div>
            </div>
          </div>
        `;
      },
      createAdminRental: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        await api('createRental', val);
        toast('Transaksi sewa berhasil dibuat.');
        ACT.closeModal();
        route();
      },
      submitReturnRental: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        await api('returnRental', val);
        toast('Pengembalian unit berhasil dicatat. Status mobil kembali Tersedia.');
        ACT.closeModal();
        route();
      },
      saveCar: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        await api('saveCar', val);
        toast('Data mobil dan foto berhasil disimpan.');
        ACT.closeModal();
        S.publicInfo = null; // Invalidate cache
        route();
      },
      saveDriver: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        await api('saveDriver', val);
        toast('Data supir berhasil disimpan.');
        ACT.closeModal();
        route();
      },
      addExpense: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        await api('addExpense', val);
        toast('Pengeluaran berhasil dicatat.');
        route();
      },
      saveSettings: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        await api('saveSettings', val);
        toast('Pengaturan rental berhasil diperbarui.');
        S.publicInfo = null;
      },
      changePassword: async (f) => {
        const val = Object.fromEntries(new FormData(f));
        if (val.newPassword !== val.confirmPassword) {
          throw new Error('Konfirmasi password baru tidak cocok.');
        }
        await api('changePassword', val);
        toast('Password berhasil diubah. Silakan login kembali.');
        ACT.logout();
      }
    };

    // LIVE CALCULATION HANDLER
    const LIVE = {
      calcPublicBooking: (f) => {
        try {
          const carSel = f.querySelector('select[name="CarID"]');
          const opt = carSel.options[carSel.selectedIndex];
          const hrgMobil = Number(opt ? opt.dataset.harga || 0 : 0);
          const hrgDriver = Number(opt ? opt.dataset.driver || 0 : 0);

          const paket = f.querySelector('input[name="Paket"]:checked').value;
          const tglMulai = f.querySelector('input[name="TglMulai"]').value;
          const jamMulai = f.querySelector('input[name="JamMulai"]').value || '09:00';
          const tglSelesai = f.querySelector('input[name="TglSelesai"]').value;
          const jamSelesai = f.querySelector('input[name="JamSelesai"]').value || '09:00';

          let durasi = 1;
          if (tglMulai && tglSelesai) {
            const d1 = new Date(tglMulai + 'T' + jamMulai + ':00');
            const d2 = new Date(tglSelesai + 'T' + jamSelesai + ':00');
            const diffHours = (d2 - d1) / (1000 * 60 * 60);
            if (diffHours > 0) {
              durasi = Math.max(1, Math.ceil((diffHours - 1) / 24));
            }
          }

          const biayaMobil = durasi * hrgMobil;
          const biayaDriver = (paket === 'Dengan Supir') ? (durasi * hrgDriver) : 0;
          const total = biayaMobil + biayaDriver;

          document.getElementById('bkg-durasi').textContent = durasi + ' Hari';
          document.getElementById('bkg-biaya-mobil').textContent = rp(biayaMobil);
          document.getElementById('bkg-biaya-driver').textContent = rp(biayaDriver);
          document.getElementById('bkg-total').textContent = rp(total);
        } catch(e) {}
      }
    };

    // GLOBAL EVENT DELEGATION
    document.addEventListener('click', (e) => {
      const btn = e.target.closest('[data-act]');
      if (!btn) return;
      const act = btn.dataset.act;
      if (ACT[act]) {
        e.preventDefault();
        ACT[act](btn, e);
      }
    });

    document.addEventListener('submit', async (e) => {
      const form = e.target.closest('form[data-form]');
      if (!form) return;
      e.preventDefault();
      const fnName = form.dataset.form;
      if (!FORMS[fnName]) return;

      const submitBtn = form.querySelector('button[type="submit"]');
      const originalText = submitBtn ? submitBtn.innerHTML : '';
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = 'Memproses...';
      }

      try {
        await FORMS[fnName](form);
      } catch (err) {
        toast(err.message, true);
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
        }
      }
    });

    document.addEventListener('input', (e) => {
      const form = e.target.closest('form[data-live]');
      if (!form) return;
      const fnName = form.dataset.live;
      if (LIVE[fnName]) {
        LIVE[fnName](form);
      }
    });
  </script>
</body>
</html>
